<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Kinematic — webcam hand tracking for desktop input</title>
  <desc id="desc">Dark technical hero banner with connected hand-joint nodes and a motion arc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080d1b"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <linearGradient id="glow" x1="820" y1="90" x2="1450" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54d6c7"/>
      <stop offset="1" stop-color="#8ba7ff"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#b6c5e5" stroke-opacity=".08"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <circle cx="1270" cy="250" r="170" fill="#54d6c7" opacity=".12" filter="url(#soft)"/>
  <path d="M930 425c35-172 175-299 356-306 82-3 151 22 214 72" fill="none" stroke="url(#glow)" stroke-linecap="round" stroke-width="5" opacity=".8"/>
  <path d="M1452 178l45 15-34 30" fill="none" stroke="#8ba7ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
  <g fill="none" stroke="#b8c9f1" stroke-opacity=".55" stroke-width="2">
    <path d="M1040 370 1110 300 1190 352 1260 226 1344 277 1418 182"/>
    <path d="M1110 300 1151 194 1260 226"/>
    <path d="M1190 352 1281 400 1344 277"/>
  </g>
  <g fill="#0b1020" stroke="url(#glow)" stroke-width="4">
    <circle cx="1040" cy="370" r="10"/><circle cx="1110" cy="300" r="10"/>
    <circle cx="1151" cy="194" r="10"/><circle cx="1190" cy="352" r="10"/>
    <circle cx="1260" cy="226" r="10"/><circle cx="1281" cy="400" r="10"/>
    <circle cx="1344" cy="277" r="10"/><circle cx="1418" cy="182" r="10"/>
  </g>
  <g fill="#f4f7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="92" y="218" font-size="92" font-weight="700" letter-spacing="3">KINEMATIC</text>
    <text x="98" y="285" font-size="25" fill="#aebddc" letter-spacing="2">WEBCAM HAND TRACKING → DESKTOP INPUT</text>
    <text x="98" y="360" font-size="18" fill="#54d6c7">OpenCV</text>
    <text x="194" y="360" font-size="18" fill="#7483a5">/</text>
    <text x="218" y="360" font-size="18" fill="#8ba7ff">MediaPipe Hands</text>
    <text x="405" y="360" font-size="18" fill="#7483a5">/</text>
    <text x="429" y="360" font-size="18" fill="#f4f7ff">PyAutoGUI adapter</text>
  </g>
</svg>
